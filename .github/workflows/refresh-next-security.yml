name: Refresh Next Security Patch

on:
  push:
    branches:
      - "rebuild/guest-experience-os"
    paths:
      - ".github/workflows/refresh-next-security.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/guest-experience-os

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate dependency lock with patched Next.js
        run: npm install next@15.5.24 eslint-config-next@15.5.24 --save-exact

      - name: Commit patched dependency graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "security: upgrade Next.js to 15.5.24"
          git push origin HEAD:rebuild/guest-experience-os
